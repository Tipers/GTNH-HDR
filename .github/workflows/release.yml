name: Release

# Runs when a release is published on the website: builds that tag and attaches the jar to the release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21

      - name: Build
        run: VERSION="$TAG" ./gradlew build --no-daemon

      - name: Attach the jar to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "build/libs/GTNH-HDR-$TAG.jar" --clobber
