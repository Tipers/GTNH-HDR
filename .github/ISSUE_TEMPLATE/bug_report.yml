name: Something doesn't work or looks wrong
description: Report a problem with GTNH-HDR
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in what you can. Your logs are in your instance folder → `logs`
        (in Prism Launcher: right-click the instance → Folder).
        Screenshots can't show HDR – a phone photo of the screen is fine.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be made to happen? (optional)
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: In the game press F12 → "Copy diagnostics", then paste here. If the game doesn't start, write "game doesn't start".
      render: text
    validations:
      required: true
  - type: input
    id: gpu
    attributes:
      label: Graphics card and driver version
      placeholder: e.g. RTX 4070, driver 566.36
    validations:
      required: true
  - type: input
    id: monitor
    attributes:
      label: Monitor model
    validations:
      required: true
  - type: dropdown
    id: windows-hdr
    attributes:
      label: Windows HDR ("Use HDR" in Settings → System → Display)
      options: ["On", "Off", "Not sure"]
    validations:
      required: true
  - type: dropdown
    id: window-mode
    attributes:
      label: Game window mode
      options: ["Windowed", "Borderless full-screen", "Exclusive full-screen", "Not sure"]
    validations:
      required: true
  - type: input
    id: gtnh
    attributes:
      label: GTNH version and launcher
      placeholder: e.g. 2.9.0, Prism Launcher
    validations:
      required: true
  - type: dropdown
    id: pack
    attributes:
      label: Shader pack in use
      options:
        - "The HDR copy made by GTNH-HDR"
        - "Original Complementary + Euphoria Patches"
        - "Another shader pack"
        - "No shaders"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log files
      description: Drag `logs/GTNH-HDR.log` and `logs/fml-client-latest.log` into this box. If the game crashed, also the newest file from `crash-reports`.
    validations:
      required: true
  - type: checkboxes
    id: other
    attributes:
      label: Other things that change the picture (tick what you use)
      options:
        - label: RTX HDR / NVIDIA filters
        - label: Windows Auto HDR
        - label: ReShade or Special K
        - label: Discord / Steam overlay, RivaTuner, OBS
  - type: dropdown
    id: without
    attributes:
      label: Does the problem go away when you remove GTNH-HDR?
      options: ["Yes", "No", "Didn't try"]
